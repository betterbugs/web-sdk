name: Sync to R2

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  sync-to-r2:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Node.js to read package.json
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Extract version from package.json
      - name: Get package version
        id: package-version
        run: echo "PACKAGE_VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      # Sync all files (except excluded) to versioned folder
      - name: Sync to R2 versioned folder
        run: |
          aws s3 sync . s3://${{ secrets.AWS_S3_BUCKET }}/${{ secrets.S3_PATH_PREFIX }}/v${{ env.PACKAGE_VERSION }}/ \
            --endpoint-url ${{ secrets.R2_ENDPOINT_URL }} \
            --exclude "README.md" \
            --exclude ".nojekyll" \
            --exclude ".gitignore" \
            --exclude "examples/*" \
            --exclude ".github/workflows/*" \
            --exclude ".git/*"

      # Sync all files (except excluded) to latest folder
      - name: Sync to R2 latest folder
        run: |
          aws s3 sync . s3://${{ secrets.AWS_S3_BUCKET }}/${{ secrets.S3_PATH_PREFIX }}/latest/ \
            --endpoint-url ${{ secrets.R2_ENDPOINT_URL }} \
            --exclude "README.md" \
            --exclude ".nojekyll" \
            --exclude ".gitignore" \
            --exclude "examples/*" \
            --exclude ".git/*" \
            --exclude ".github/workflows/*" \
            --delete
